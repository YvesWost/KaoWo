<title>考试</title>
<script>
  // 提前应用主题，避免深色模式闪白；键名与作答缓存隔离
  (function () {
    var t = null;
    try { t = localStorage.getItem("exam-ui:theme"); } catch (e) {}
    if (!t) t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    document.documentElement.dataset.theme = t || "light";
  })();
</script>
<!-- 主题配色：同步加载，读 localStorage 后立即应用，避免闪默认蓝 -->
